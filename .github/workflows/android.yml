name: Android APK
on:
  push:
    paths-ignore:
      - '**.md'
      - '.gitignore'

concurrency:
  group: android-build
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.2.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: barichello/godot-ci:4.2.1
    steps:
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
      - name: Cache Godot imports
        uses: actions/cache@v4
        with:
          path: .godot
          key: godot-import-${{ hashFiles('project.godot', '**/*.png', '**/*.jpg', '**/*.glb', '**/*.gd', '**/*.tscn') }}
          restore-keys: godot-import-
      - name: Set version code
        run: |
          sed -i "s|^version/code=.*|version/code=${GITHUB_RUN_NUMBER}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"0.1.${GITHUB_RUN_NUMBER}\"|" export_presets.cfg
          grep -n "version/" export_presets.cfg
          sh ci_stamp.sh
      - name: Build release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: /tmp/release.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: shadows
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > /tmp/release.keystore
          mkdir -v -p build/android
          godot --headless --verbose --editor --quit || true
          godot --headless --verbose --export-release "Android Release" build/android/shadows-of-pakistan.apk
      - name: Align and sign APK
        env:
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -e
          APKSIGNER=$(find / -xdev -name apksigner -type f 2>/dev/null | head -n 1)
          ZIPALIGN=$(find / -xdev -name zipalign -type f 2>/dev/null | head -n 1)
          echo "apksigner: $APKSIGNER"
          echo "zipalign: $ZIPALIGN"
          test -n "$APKSIGNER" || { echo "apksigner not found"; exit 1; }
          test -n "$ZIPALIGN" || { echo "zipalign not found"; exit 1; }
          cd build/android
          mv shadows-of-pakistan.apk raw.apk
          "$ZIPALIGN" -p -f 4 raw.apk aligned.apk
          "$APKSIGNER" sign --ks /tmp/release.keystore --ks-key-alias shadows --ks-pass env:KEYSTORE_PASS --key-pass env:KEYSTORE_PASS --out shadows-of-pakistan.apk aligned.apk
          "$APKSIGNER" verify --verbose --print-certs shadows-of-pakistan.apk
          "$ZIPALIGN" -c 4 shadows-of-pakistan.apk && echo "ALIGNMENT OK"
          rm -f raw.apk aligned.apk *.idsig
      - name: Verify APK integrity
        run: |
          ls -l build/android/shadows-of-pakistan.apk
          sha256sum build/android/shadows-of-pakistan.apk
          unzip -tq build/android/shadows-of-pakistan.apk
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest APK
          prerelease: true
          files: build/android/shadows-of-pakistan.apk
